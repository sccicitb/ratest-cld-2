[project]
name = "rag-chat-backend"
version = "0.1.0"
description = "Self-hosted RAG chat backend (FastAPI + Qdrant + FastEmbed). See docs/BACKEND_SPEC.md."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",   # multipart uploads (§6.1, §8.3)
    "pyjwt>=2.9",                 # access/refresh JWTs (§4)
    "bcrypt>=4.1",                # password hashing (§10)
    "httpx>=0.27",                # async HTTP + FastAPI TestClient
]

[project.optional-dependencies]
# Vector store + in-process embeddings/rerank — install for retrieval/ingestion.
rag = [
    "qdrant-client>=1.11",        # vector store (§9.2)
    "fastembed>=0.3",            # BGE-M3 embeddings + reranker, in-process (§8.1/§8.5)
]
# OpenAI-compatible chat client → MODEL_BASE_URL (§7).
llm = [
    "openai>=1.40",
]
# Document extraction / OCR — install when implementing ingestion (§8.1).
# surya-ocr is large (model weights) and Open-RAIL-M licensed (§6) — add explicitly.
ingest = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    # "surya-ocr>=0.6",
]
# MCP tools (satudata, §12.2) — install when wiring external tools.
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
