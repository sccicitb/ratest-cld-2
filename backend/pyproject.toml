[project]
name = "rag-chat-backend"
version = "0.1.0"
description = "Self-hosted RAG chat backend (FastAPI + Qdrant + FlagEmbedding). See docs/BACKEND_SPEC.md."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9", # multipart uploads (§6.1, §8.3)
    "pyjwt>=2.9", # access/refresh JWTs (§4)
    "bcrypt>=4.1", # password hashing (§10)
    "httpx>=0.27", # async HTTP + FastAPI TestClient
    "pdf-oxide==0.3.74",
    "onnxruntime==1.23.2",
]

[project.optional-dependencies]
# Vector store + in-process embeddings/rerank — install for retrieval/ingestion.
# FlagEmbedding pulls torch (heavy); GPU via torch CUDA. NOT FastEmbed — that's
# ONNX-only and does not ship BGE-M3 (§8.1/§8.5).
rag = [
    "qdrant-client>=1.11",        # vector store (§9.2)
    "FlagEmbedding>=1.2",        # BGE-M3 embeddings + bge-reranker-v2-m3, in-process
    "transformers>=4.56.1,<5",  # pin retained for FlagEmbedding/BGE-M3 compat
]
# OpenAI-compatible chat client → MODEL_BASE_URL (§7).
llm = [
    "openai>=1.40",
]
# Document extraction / OCR — install when implementing ingestion (§8.1).
ingest = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "transformers>=4.56.1,<5",  # pin retained for FlagEmbedding/BGE-M3 compat
]
# MCP tools (satudata, §12.2) — install when wiring external tools.
mcp = [
    "mcp>=1.0",
    "pyyaml>=6",
]
# Code-exec sandbox service.
# docker>=7: ContainerManager + integration tests.
# ipython, matplotlib: needed to import runner.py in-process for unit tests
#   (runner/requirements.txt is the authoritative list baked into the image;
#    these extras mirror the subset needed for in-process test_runner.py).
sandbox = [
    "docker>=7",
    "ipython>=8",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# The voice sidecar (voice/tests) runs in its own env with its own deps --
# `cd voice && uv run pytest` -- so it is excluded from backend discovery.
testpaths = ["tests", "sandbox/tests"]
filterwarnings = [
    "ignore:Payload indexes have no effect in the local Qdrant.*:UserWarning",
]
