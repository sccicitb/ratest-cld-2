[project]
name = "voice-service"
version = "0.1.0"
description = "STT sidecar — keeps engine deps out of the backend env"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0",
    "av>=12",
    "numpy>=1.26",
    # faster-whisper pulls onnxruntime transitively (allows >=1.14,<2). Pin to
    # the same version the backend already uses: 1.24+ dropped cp310 wheels
    # on macOS, which breaks `uv run` on this Python 3.10 dev box.
    "onnxruntime==1.23.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]

[tool.uv]
package = false
